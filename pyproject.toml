[project]
name = "hunter"
version = "0.1.0"
description = "Poll Serbian rental sites and notify Telegram when a listing matches."
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "beautifulsoup4",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
